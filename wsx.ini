; MizuBox by Mizushi (Enhanced Fork of AnyXboxSeries by edupode) Configuration
; Priority: Environment Variables (WSX_*) > wsx.ini > Built-in Defaults

[Console]
; Options: anaconda (Xbox Series X / 4K), lockhart (Xbox Series S / 1440p), 1080p (Xbox One), devkit
type = anaconda
sandbox_id = XDKS.1
console_id = 00000000.00000000.00000000.00000001.01
locale = en-US

[User]
gamertag = LocalPlayer#0001
xuid = 0x0009000000000001

[Input]
; Expose a Virtual Xbox Series X|S Controller (WASD + IJKL keyboard-backed) on Slot 0 when no physical XInput controller is attached
virtual_gamepad = 1
; Circular radial deadzones (0..32000) & trigger threshold (0..250)
deadzone_left = 7849
deadzone_right = 8689
trigger_deadzone = 30
invert_right_y = 0

[Storage]
; Leave empty to store alongside the title executable (xgs_saves / pls_cache)
gamesave_dir =
pls_dir =
gamesave_quota_mb = 256

[Memory]
; Maximum size-class slab pool cache (64 KB .. 2 MB blocks) retained in xmem.dll (0 = disable pooling)
xmem_pool_max_mb = 64

[Network]
; Force local offline networking mode (1 = offline, 0 = WinHTTP loopback/online)
offline_net = 0

[Audio]
; Force clean-room software XAudio2_9 fallback instead of Windows System32 XAudio2_9 bridge (0 = System32 bridge + automatic headless rescue, 1 = software fallback)
xaudio2_software_fallback = 0

[Graphics]
; Primary graphics backend: d3d12 (pure Direct3D 12 SM 6.6 Dynamic Resources + DXR Tier 1.1)
backend = d3d12
; Return native Xbox Series X|S binary vtable ABI directly from D3D12XboxCreateDevice (0 = desktop COM + explicit D3D12XboxGetXboxAbiDevice, 1 = automatic)
xbox_abi = 0
; Optional directory containing pre-translated desktop SM 6.6 DXIL shaders (<32-hex-hash>.dxil / .cso)
shader_cache_dir =
; Persistent native driver ID3D12PipelineLibrary1 binary PSO disk cache (leave empty for default next to executable)
pso_cache_path =
pso_cache_disable = 0
; Reject untranslated FSSM/ACCC RDNA2 or @xbox.* DXIL shaders cleanly with E_NOTIMPL before GPU driver submission
strict_shader_check = 0
; Built-in pure Direct3D 12 RDNA2 (FSSM + ACCC/FSPX) -> Optimized SM 6.6 HLSL -> signed DXIL auto-translator (0 = off, 1 = on)
auto_translate_fssm = 0
; RDNA2 CFG optimizer mode: auto (StraightLine -> Relooper -> TopoDag -> StateMachine), topodag, statemachine
rdna2_cfg_mode = auto
; Branchless ternary select() for EXEC-masked pure VALU writes (isolated = single-op runs, all = every pure VALU, off)
rdna2_branchless_valu = isolated
; Automatic Wave32-safe GroupMemoryBarrierWithGroupSync() on intra-block LDS RAW/WAR hazards (1 = on, 0 = off)
rdna2_auto_lds_barrier = 1
; Clamp NaN/Inf on RWTexture2D float stores to FP16/R11G11B10F finite range +/-65024 (1 = on, 0 = off)
rdna2_clamp_finite_stores = 1
; Wave64 emulation on 32-lane NVIDIA/Intel GPUs (auto = groupshared 2x32 on 32-wide / [WaveSize(64)] on AMD, 1 = force, 0 = off, native64 = [WaveSize(64)])
wave64_emulate = auto
; Native 16-bit FP16 ALU for RDNA2 VOP3P packed half ops (0 = FP32 compat, 1 = native float16_t2)
fp16_vop3p = 0
; High-precision hybrid QPC FPS limiter (0 = uncapped, or e.g. 30 / 60 / 120)
max_fps = 0
; Optional DXC optimization level override (-1 = auto -O3 up to 96 KB HLSL, else 0..3)
; dxc_opt_level = 3
; GPU SM 6.6 Compute Deswizzler for tiled guest UMA textures (1 = >=16KB, force = all 2D tiled, 0 = CPU only)
gpu_deswizzle = 1
; Background worker threads for asynchronous RDNA2 -> DXIL shader pre-compilation (0 = auto)
async_shader_threads = 0
; Target refresh rate in Hz (60, 120, or 0 for unlocked)
refresh_hz = 60
; Variable Refresh Rate (DXGI_PRESENT_ALLOW_TEARING)
vrr = 0
; High Dynamic Range (HDR10 / scRGB)
hdr = 0
; Direct3D 12 Debug Layer & GPU-Based Validation (automatically on in Debug builds)
debug_layer = 0
gpu_validation = 0
; Zero-Copy SwapChain Backbuffer Hand-off (1 = enabled, 0 = disabled)
zero_copy = 1
; Unified Memory Architecture (UMA) emulation: allows CPU Map() on DEFAULT/L1 buffers via GPU_UPLOAD / CUSTOM L0 heaps
uma_emulation = 1

[Diagnostics]
; On-Screen Pure DX12 SM 6.6 Debug HUD Overlay (also toggleable live with F11)
hud = 0
; D3D12 DRED GPU Auto-Breadcrumbs & Page-Fault diagnostics on device removal
dred = 0
; Automatic symbolized crash report (.txt) + WinDbg minidump (.dmp) on unhandled exceptions
crash_dumps = 1
crash_dir =
; Structured API Call Tracer (logs every X*/D3D12Xbox* call with timestamps and TIDs)
trace = 0
trace_file = wsx_trace.log
